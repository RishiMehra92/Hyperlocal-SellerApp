  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.5.3
  fl_chart: ^1.1.1
  video_compress: ^3.1.4
  url_launcher: ^6.3.2
  sleek_circular_slider: ^2.1.0
  pretty_dio_logger: ^1.4.0
  intl_phone_field: ^3.2.0
  flutter_widget_from_html: ^0.17.2
  audioplayers: ^6.1.0
  flutter_inappwebview: ^6.1.5
  upgrader: ^13.5.0
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2
  flutter_http_inspector:
    git:
      url: https://github.com/InfinitieParasgiri/flutter_http_inspector.git

  collection: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/png/
    - assets/images/payment-logos/
    - assets/images/svg/
    - assets/audio/
    - assets/
    - assets/images/
    - assets/images/app_logo/

  # An image asset can refer to one or more_page resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo/seller_app_logo.png"